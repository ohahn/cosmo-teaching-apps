<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang nucleosynthesis</title>
<style>
html, body { margin: 0; background: #fff; overflow-x: hidden; }
#wrap { overflow: hidden; }
#stage { width: 1560px; padding: 14px 20px; transform-origin: 0 0; box-sizing: border-box; }
/* drags on the diagrams move the event / sliders instead of scrolling the page (tablets) */
.app svg { touch-action: none; }
#note { display: none; align-items: center; gap: 12px; padding: 8px 14px; background: #eef3fb; color: #1f3b73;
  font: 15px/1.35 "Palatino Linotype", Palatino, "Book Antiqua", serif; border-bottom: 1px solid #dde4f0; }
#note.show { display: flex; }
#note span { flex: 1; }
#note button { font: inherit; font-size: 20px; line-height: 1; border: none; background: none; color: #1f3b73; cursor: pointer; }
.app-slide h2 { font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif; color: #1f3b73; font-weight: normal; margin: 0; }
.footer { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 6px;
  font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif; font-size: 14px; color: #8a9bb8; }
.footer a { color: #5d7bb0; margin-right: auto; }
.footer .lic a { color: inherit; margin: 0; }
.footer img { height: 20px; width: auto; opacity: 0.85; }
/* Interactive apps: same palette and typeface as the lecture notes */
.app-slide h2 { font-size: 38px; margin-bottom: 6px; }
.app {
  font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
  color: #1f3b73; font-size: 22px; text-align: left; line-height: 1.3;
}
.app svg { display: block; max-width: none; max-height: none; }
.app .app-controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.app .btn-group { display: inline-flex; }
.app button {
  font: inherit; font-size: 18px; padding: 4px 11px; cursor: pointer;
  border: 1px solid #7f9dc8; background: #fff; color: #1f3b73;
}
.app .btn-group button + button { border-left: none; }
.app .btn-group button:first-child { border-radius: 5px 0 0 5px; }
.app .btn-group button:last-child { border-radius: 0 5px 5px 0; }
.app button:hover { background: #eef3fb; }
.app button.active { background: #1f3b73; color: #fff; }
.app label { font-size: 20px; white-space: nowrap; }
.app label span { display: inline-block; min-width: 3.2em; }
.app input[type=range] { width: 170px; vertical-align: middle; accent-color: #1f3b73; }
.app .app-plot, .app .dplot { position: relative; }
.app .legend {
  position: absolute; left: 95px; top: 16px; padding: 6px 12px; font-size: 18px;
  background: rgba(255, 255, 255, 0.9); border: 1px solid #dde4f0; border-radius: 5px;
}
.app .legend-item { cursor: pointer; user-select: none; }
.app .legend-item.off { opacity: 0.3; }
.app .legend-item svg { display: inline-block; vertical-align: middle; }
.app .axis text { font-family: inherit; font-size: 16px; fill: #1f3b73; }
.app .axis path, .app .axis line { stroke: #1f3b73; }
.app .axis-label { font-size: 20px; fill: #1f3b73; }
.app .ztick, .app .small-label, .app .ref-label { font-size: 17px; fill: #1f3b73; }
.app .ref-label { fill: #7f9dc8; }
.app .plane-label { font-size: 17px; }
.app .plane-label.big { font-size: 21px; font-style: italic; }
.app .warn { font-size: 26px; fill: #c0392b; }
.app .app-info { font-size: 20px; min-height: 3.4em; margin-top: 4px; }

/* F: build your universe */
.app .universe-grid { display: grid; grid-template-columns: 600px 900px; column-gap: 30px; }
.app .universe-grid .plane { grid-row: 1; grid-column: 1; }
.app .universe-grid .right { grid-row: 1 / span 2; grid-column: 2; }
.app .universe-grid .readout { grid-row: 2; grid-column: 1; font-size: 19px; }
.app .universe-grid .readout div { margin: 3px 0; }

/* H: distances */
.app .dist-grid { display: grid; grid-template-columns: 1020px 480px; column-gap: 20px; }
.app .dist-grid .readout { font-size: 19px; padding-top: 10px; }
.app .dist-grid .readout .zbig { font-size: 34px; color: #e08a00; margin-bottom: 6px; }
.app .dist-grid .readout table { margin: 10px 0; border-collapse: collapse; font-size: 19px; }
.app .dist-grid .readout td { padding: 2px 10px 2px 0; border: none; }
.app .dist-grid .readout td:last-child { color: #667; font-size: 17px; }
.app .strip { position: relative; margin-top: 6px; }
.app .strip .tolman { position: absolute; left: 14px; top: 8px; color: #cfe3ff; font-size: 17px; }
.app .strip-label { fill: #cfe3ff; font-size: 17px; }
.app .olegend { display: flex; gap: 22px; font-size: 18px; margin: 4px 0 0 70px; }
.app .olegend svg { display: inline-block; vertical-align: middle; }
.app .strip .credit { fill: #7f9dc8; font-size: 14px; }
.app .wave-label { font-size: 17px; font-weight: bold; paint-order: stroke; stroke: white; stroke-width: 4px; }

/* C: CMB sky and power spectrum */
.app .cmb-grid { display: grid; grid-template-columns: 900px 590px; column-gap: 30px; }
.app .cmb-grid .app-controls { margin-bottom: 4px; gap: 12px; }
.app .cmb-grid button { font-size: 17px; padding: 3px 9px; }
.app .cmb-grid button:disabled { opacity: 0.4; cursor: default; }
.app .cmb-map canvas.sky { display: block; touch-action: none; cursor: crosshair; }
.app .cmb-canvas { position: relative; width: 900px; height: 450px; }
.app .cmb-canvas canvas.outline { position: absolute; left: 0; top: 0; pointer-events: none; }
.app .cmb-inset { position: absolute; right: 0; bottom: 0; background: #fff; border: 2px solid #1f3b73;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.app .cmb-inset.left { right: auto; left: 0; }
.app .cmb-inset canvas { display: block; }
.app .cmb-inset .inset-bar { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 1px 4px 1px 8px; }
.app .cmb-grid .cmb-inset button { font-size: 15px; padding: 0 8px; line-height: 1.3; }
.app .zoomck, .app .noiseck { font-size: 15px; color: #1f3b73; margin-right: 10px; }
.app .cmb-under { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #667; margin: 2px 0 6px; }
.app .cmb-cbar { display: inline-flex; flex-direction: column; width: 300px; }
.app .cmb-cbar canvas { width: 300px; height: 12px; image-rendering: auto; border: 1px solid #dde4f0; }
.app .cbar-labels { display: flex; justify-content: space-between; }
.app .cmb-plot { position: relative; }
.app .cmb-legend { left: auto; right: 24px; top: 8px; font-size: 16px; padding: 4px 10px; }
.app .cmb-legend svg { display: inline-block; vertical-align: middle; }
.app .cmb-legend .small { font-size: 14px; color: #8a9bb8; }
.app .bin-note { font-size: 14px; fill: #8a9bb8; pointer-events: none; }
.app .band-label { fill: #b5651d; font-size: 16px; pointer-events: none; }
.app .lens { font-size: 18px; }
.app .cmb-sliders { margin: 6px 0 10px; }
.app .cmb-slider { display: flex; align-items: center; gap: 10px; height: 42px; }
.app .cmb-slider .name { width: 60px; font-size: 21px; }
.app .cmb-slider input[type=range] { width: 290px; }
.app .cmb-slider .val { font-size: 19px; white-space: nowrap; }
.app .cmb-hint { font-size: 17px; line-height: 1.35; min-height: 7.2em; margin: 8px 0; padding: 8px 12px;
  background: #f5f8fc; border-left: 3px solid #7f9dc8; }
.app .cmb-readout { font-size: 17px; line-height: 1.45; }
.app .cmb-readout table.chi2 { border-collapse: collapse; margin: 8px 0 4px; font-size: 17px; }
.app .cmb-readout table.chi2 td, .app .cmb-readout table.chi2 th { padding: 1px 12px 1px 0; border: none; text-align: right; font-weight: normal; }
.app .cmb-readout table.chi2 th { color: #667; font-size: 15px; }
.app .cmb-readout table.chi2 td:first-child { text-align: left; }
.app .cmb-readout .small { font-size: 14px; color: #8a9bb8; }

/* N: Big Bang nucleosynthesis */
.app .bbn-grid { display: grid; grid-template-columns: 900px 590px; column-gap: 30px; }
.app .bbn-grid .app-controls { margin-bottom: 4px; gap: 16px; }
.app .bbn-grid button { font-size: 17px; padding: 3px 10px; }
.app .bbn-grid button.play { min-width: 6.5em; }
.app .eqck { font-size: 17px; }
.app .bbn-now { font-size: 18px; margin-left: auto; color: #b5651d; }
.app .bbn-plot svg, .app .bbn-strip svg { touch-action: none; cursor: ew-resize; }
.app .bbn-strip { position: relative; }
.app .bbn-sleg { left: auto; right: 64px; top: 8px; font-size: 15px; padding: 3px 9px; line-height: 1.35; }
.app .bbn-sleg svg { display: inline-block; vertical-align: middle; }
.app .spec-label { font-size: 17px; font-weight: bold; }
.app .eq-label { font-size: 15px; }
.app .bbn-hint { font-size: 17px; line-height: 1.35; min-height: 4.1em; margin: 6px 0 0; padding: 8px 12px;
  background: #f5f8fc; border-left: 3px solid #7f9dc8; }
.app .bbn-sliders { margin: 0 0 4px; }
.app .bbn-slider { display: flex; align-items: center; gap: 10px; height: 40px; }
.app .bbn-slider .name { width: 44px; font-size: 21px; }
.app .bbn-slider input[type=range] { width: 250px; }
.app .bbn-slider .val { font-size: 19px; white-space: nowrap; }
.app .bbn-slider .val .small { font-size: 15px; color: #8a9bb8; margin-left: 6px; }
.app .cell-label { font-size: 19px; font-weight: bold; }
.app .cell-val { font-size: 13px; fill: #1f3b73; }
.app .gap-label { font-size: 15px; fill: #9aa7bf; }
.app .gap-sub { font-size: 13px; fill: #8a9bb8; }
.app .q-label { font-size: 16px; font-weight: bold; }
.app .q-label .q-val { font-weight: normal; font-size: 15px; }
.app .eq-label, .app .ev-label { paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.app .bbn-readout { font-size: 17px; line-height: 1.4; margin-top: 8px; }
.app .bbn-readout .small { font-size: 15px; color: #8a9bb8; }

/* N-body: simulating the cosmic web */
.app .nb-grid { display: grid; grid-template-columns: 860px 650px; column-gap: 40px; }
.app .nb-grid .app-controls { margin-bottom: 4px; gap: 14px; }
.app .nb-grid button { font-size: 17px; padding: 3px 10px; }
.app .nb-grid label { font-size: 17px; }
.app .nb-view { position: relative; width: 860px; height: 700px; margin-bottom: 6px; }
.app .nb-view canvas { display: block; touch-action: none; cursor: grab; border-radius: 4px; }
.app .nb-view canvas:active { cursor: grabbing; }
.app .nb-z { position: absolute; left: 16px; top: 10px; font-size: 30px; color: #f4b65c; pointer-events: none; }
.app .nb-modelabel { position: absolute; right: 16px; top: 14px; font-size: 19px; color: #cfe3ff; pointer-events: none; }
.app .nb-scale { position: absolute; left: 16px; bottom: 10px; font-size: 16px; color: #8fa6cc; pointer-events: none; }
.app .nb-msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: #cfe3ff; font-size: 20px; }
.app .nb-time .tslider { width: 560px; }
.app .nb-time .play { min-width: 6.5em; }
.app .nb-zval { font-size: 17px; color: #667; }
.app .nb-grid .small-lab input[type=range] { width: 110px; }
.app .nb-sliders { margin: 0 0 4px; }
.app .nb-slider { display: flex; align-items: center; gap: 10px; height: 40px; }
.app .nb-slider .name { width: 44px; font-size: 21px; }
.app .nb-slider input[type=range] { width: 300px; }
.app .nb-slider .val { font-size: 19px; white-space: nowrap; }
.app .nb-slider .val .small { font-size: 15px; color: #8a9bb8; margin-left: 6px; }
.app .nb-opts { font-size: 17px; }
.app .nb-opts .unit { font-size: 15px; color: #667; }
.app .nb-status { font-size: 16px; line-height: 1.4; margin: 6px 0 4px; min-height: 2.8em; }
.app .nb-status .run { color: #b5651d; }
.app .nb-status .small { font-size: 15px; color: #667; }
.app .nb-plot { position: relative; }
.app .nb-plot .pkmode { position: absolute; left: 92px; top: 20px; }
.app .nb-plot .pkmode button { font-size: 15px; padding: 1px 8px; }
.app .nb-legend { left: auto; right: 24px; top: 20px; font-size: 15px; padding: 3px 9px; line-height: 1.35; }
.app .nb-legend svg { display: inline-block; vertical-align: middle; }
/* fixed slot: a long hint grows upwards over the plot instead of changing the page height
   (which would rescale the slide, move the button away from the pointer and flicker) */
.app .nb-hintbox { position: relative; font-size: 16px; height: calc(5.4em + 16px); margin: 6px 0 0; }
.app .nb-hint { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; box-sizing: border-box;
  font-size: 16px; line-height: 1.35; min-height: calc(5.4em + 16px); padding: 8px 12px;
  background: #f5f8fc; border-left: 3px solid #7f9dc8; box-shadow: 0 -2px 6px rgba(60, 80, 120, 0.12); }
.app .nb-grid button:disabled { opacity: 0.35; cursor: default; }
.app .nb-lclab { position: absolute; inset: 0; pointer-events: none; }
.app .nb-lclab span { position: absolute; transform: translate(4px, -50%); font-size: 14px; color: #8fa6cc; white-space: nowrap; }
.app .nb-lclab span.obs { transform: translate(-50%, 6px); color: #f4b65c; }

/* Halo mass function: hierarchical structure formation and its probes */
.app-hmf { font-size: 18px; }
.app .hmf-top .row { display: flex; align-items: center; gap: 22px; height: 40px; }
.app .hmf-top button { font-size: 16px; padding: 3px 10px; }
.app .hmf-top .tabs button { font-size: 17px; }
.app .hmf-top .play { min-width: 6.5em; }
.app .hmf-top .btns { margin-left: auto; display: flex; gap: 8px; }
.app .hmf-z, .app .hmf-slider { display: flex; align-items: center; gap: 8px; }
.app .hmf-z .name, .app .hmf-slider .name { font-size: 20px; min-width: 26px; }
.app .hmf-z input[type=range] { width: 430px; }
.app .hmf-slider input[type=range] { width: 210px; }
.app .hmf-z .val, .app .hmf-slider .val { font-size: 18px; min-width: 3.2em; }
.app .hmf-tab.t0 { display: grid; grid-template-columns: 900px 610px; column-gap: 24px; margin-top: 4px; }
.app .hmf-tab.t1 { display: grid; grid-template-columns: 760px 760px; gap: 2px 18px; margin-top: 2px; }
.app .hmf-right .ptitle { font-size: 17px; margin: 0 0 0 62px; }
.app .hmf-read { font-size: 17px; line-height: 1.45; margin-top: 4px; }
.app .hmf-read .big { font-size: 19px; }
.app .hmf-read .small { font-size: 15px; color: #667; }
.app .hmf-p .phead { display: flex; align-items: center; gap: 14px; height: 32px; padding-left: 76px; font-size: 16px; }
.app .hmf-p .ptitle { font-size: 17px; }
.app .hmf-p.pB svg { display: inline-block; vertical-align: top; }
.app .hmf-p button { font-size: 15px; padding: 1px 8px; }
.app .hmf-leg { font-size: 14px; display: flex; gap: 12px; }
.app .hmf-leg svg { display: inline-block; vertical-align: middle; }
.app .hmf-p .mini { font-size: 14px; }
.app .hmf-p .mini input[type=range] { width: 80px; }
.app .hmf-p .mini span { min-width: 0; }
.app .dnote { font-size: 14px; color: #8a9bb8; }
.app .hmf-al { font-size: 17px; }
.app .hmf-zbig { font-size: 30px; fill: #e08a00; }
.app .hmf-zmid { font-size: 22px; fill: #e08a00; }
.app .hmf-mstar { font-size: 19px; fill: #1f3b73; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.app .hmf-nulab { font-size: 15px; }
.app .hmf-curlab, .app .hmf-dotlab { paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.app .hmf-hint { font-size: 16px; line-height: 1.35; min-height: 4.1em; margin: 4px 0 0; padding: 7px 12px;
  background: #f5f8fc; border-left: 3px solid #7f9dc8; }

</style>
</head>

<script>
// Background cosmology shared by the interactive apps.
// Units: time in Gyr, distance in Gly (so c = 1), unless a name says otherwise.
// Plain script (no ES modules, so the deck also works from file://); exports window.Cosmo.
(() => {
  const GYR_PER_INV_H = 977.792;   // 1/(km/s/Mpc) in Gyr
  const C_KMS = 299792.458;
  const OR_PLANCK = 9.24e-5;       // photons + neutrinos, Table 1.1

  // Table 1.1 of the notes, flat (Omega_Lambda = 1 - Omega_m - Omega_r)
  const PLANCK = { H0: 67.66, Om: 0.3111, OL: 1 - 0.3111 - OR_PLANCK };

  const COL = {
    text: "#1f3b73", tangerine: "#f4b65c", line: "#7f9dc8", sky: "#0b1630",
    red: "#c0392b", green: "#2e8b57", purple: "#7b4fa0", grey: "#999",
  };

  // A model: {H0 [km/s/Mpc], Om, OL, Or}; curvature from Omega_K = 1 - sum.
  function model(p) {
    const Or = p.Or ?? OR_PLANCK, Om = p.Om, OL = p.OL;
    const Ok = 1 - Om - OL - Or;
    const H0 = p.H0 / GYR_PER_INV_H;      // 1/Gyr
    const E2 = a => Or / a ** 4 + Om / a ** 3 + Ok / a ** 2 + OL;
    return { H0kms: p.H0, Om, OL, Or, Ok, H0, tH: 1 / H0, E2 };
  }

  // Did the Universe start at a = 0? (E^2 > 0 for all 0 < a <= 1)
  function hasBigBang(m) {
    for (let i = 0; i <= 600; i++) {
      const a = Math.exp(-14 + 14 * i / 600);
      if (m.E2(a) <= 0) return false;
    }
    return true;
  }

  // Scale factor at which the expansion turns around in the future, or null.
  function turnaround(m) {
    for (let i = 1; i <= 1200; i++) {
      const a = Math.exp(14 * i / 1200);
      if (m.E2(a) <= 0) return a;
    }
    return null;
  }

  // Age of the Universe [Gyr]: t0 = int_0^1 da / (a H)
  function age(m) {
    if (!hasBigBang(m)) return null;
    const n = 4000, x0 = Math.log(1e-10);
    let s = 0;
    for (let i = 0; i <= n; i++) {
      const a = Math.exp(x0 * (1 - i / n));
      const f = 1 / Math.sqrt(m.E2(a));
      s += (i === 0 || i === n ? 0.5 : 1) * f;
    }
    return s * (-x0 / n) / m.H0;
  }

  const q0 = m => m.Or + m.Om / 2 - m.OL;

  // a(t) from the second Friedmann equation, integrated from today (a = 1, adot = H0)
  // backwards and forwards. Returns points {t: t - t0 [Gyr], a} and the times of
  // the Big Bang / Big Crunch if they happen inside [tmin, tmax].
  function evolve(m, tmin, tmax) {
    const acc = a => m.H0 * m.H0 * (-m.Or / a ** 3 - m.Om / (2 * a * a) + m.OL * a);
    const dtmax = (tmax - tmin) / 600;
    function branch(dir, tend) {
      let t = 0, a = 1, v = m.H0;
      const pts = [{ t, a }];
      let end = null;
      for (let k = 0; k < 200000; k++) {
        const scale = a / Math.sqrt(v * v + Math.abs(acc(a)) * a + 1e-12);
        const h = dir * Math.min(dtmax, 0.004 * scale);
        // RK4 for (a, v)

    let rho = 0, pr = 0;

      const e = z + (i - 0.5) * umax / N, q2 = e * e - z * z, q = Math.sqrt(q2), fd = 1 / (EX(e) + 1);
      rho += e * e * q * fd; pr += q2 * q * fd;
    }
    const c = 4 * T ** 4 / (2 * Math.PI ** 2) * umax / N;
    return [rho * c, pr * c / 3];
  }
  const G = { T9: new Float64Array(NU), T: new Float64Array(NU), Tnu: new Float64Array(NU), rhoPl: new Float64Array(NU),
    rhoNu1: new Float64Array(NU), dlnadu: new Float64Array(NU), rhob1: new Float64Array(NU),
    lf: RX.map(() => new Float64Array(NU)), lrr: RX.map(() => new Float64Array(NU)), wf: new Float64Array(NU), wr: new Float64Array(NU) };
  {
    const s = new Float64Array(NU);
    for (let i = 0; i < NU; i++) {
      const T9 = T9START * EX(-i * DU), T = T9 * MEV_PER_T9;
      const [re, pe] = electrons(T), rg = Math.PI ** 2 / 15 * T ** 4;
      G.T9[i] = T9; G.T[i] = T; G.rhoPl[i] = rg + re;
      s[i] = (4 / 3 * rg + re + pe) / T;
    }
    const Ts = G.T[0], sEnd = s[NU - 1], TE = G.T[NU - 1];
    const nbPerEta = 2 * ZETA3 / Math.PI ** 2 * (TE / HBARC) ** 3 * MU;   // rho_b today-equivalent [g/cm^3] / eta at T_end
    for (let i = 0; i < NU; i++) {
      G.Tnu[i] = Ts * P(s[i] / s[0], 1 / 3);
      G.rhoNu1[i] = 7 / 8 * Math.PI ** 2 / 15 * G.Tnu[i] ** 4;
      G.rhob1[i] = nbPerEta * s[i] / sEnd;
      const i0 = Math.max(0, i - 1), i1 = Math.min(NU - 1, i + 1);
      G.dlnadu[i] = -(Math.log(s[i1]) - Math.log(s[i0])) / (3 * (i1 - i0) * DU);
      const T9 = G.T9[i], Tc = Math.min(T9, 10);
      [G.wf[i], G.wr[i]] = weak(T9);
      RX.forEach((r, k) => {
        if (r.weak) return;
        G.lf[k][i] = Math.log(Math.max(r.f(Tc), 1e-300));
        // reverse / forward, without the density factors: rev (0.987e10 T9^1.5)^(n_in - n_out) e^(-Q/T9)
        G.lrr[k][i] = r.rev ? Math.log(r.rev) + (r.in.length - r.out.length) * Math.log(0.987e10 * P(T9, 1.5)) - r.q / T9 : -Infinity;
      });
    }
  }

  // --- one run ----------------------------------------------------------------------------
  // P: { eta10, Neff, tau }
  function makeModel(par) {
    const eta = par.eta10 * 1e-10, tau = par.tau;
    // dt/du [s] for this N_eff
    const dtdu = new Float64Array(NU), time = new Float64Array(NU), H = new Float64Array(NU);
    for (let i = 0; i < NU; i++) {
      const rho = G.rhoPl[i] + par.Neff * G.rhoNu1[i];
      H[i] = Math.sqrt(8 * Math.PI / 3 * rho) / MPL / HBAR;
      dtdu[i] = G.dlnadu[i] / H[i];
    }
    time[0] = 1 / (2 * H[0]);
    for (let i = 1; i < NU; i++) time[i] = time[i - 1] + 0.5 * (dtdu[i] + dtdu[i - 1]) * DU;
    const fe = new Float64Array(NR), re = new Float64Array(NR);
    let dtduNow = 0;
    // forward and reverse rates at u, in fe/re [1/s per Y^...]
    function eval_(u) {
      const x = Math.min(Math.max(u / DU, 0), NU - 1.000001), i = Math.floor(x), w = x - i;
      const lin = a => a[i] + w * (a[i + 1] - a[i]);
      const rho = eta * EX(Math.log(G.rhob1[i]) + w * (Math.log(G.rhob1[i + 1]) - Math.log(G.rhob1[i])));
      dtduNow = lin(dtdu);
      for (let k = 0; k < NR; k++) {
        const r = RX[k];
        if (r.weak) { fe[k] = lin(G.wf) / tau; re[k] = lin(G.wr) / tau; continue; }
        const lf = lin(G.lf[k]);
        fe[k] = EX(lf) * (r.in.length > 1 ? P(rho, r.in.length - 1) : 1);
        const lr = G.lrr[k][i] + w * (G.lrr[k][i + 1] - G.lrr[k][i]);
        re[k] = r.rev ? EX(lf + lr) * (r.out.length > 1 ? P(rho, r.out.length - 1) : 1) : 0;
      }
    }
    // net rate of reaction k [1/s per baryon] for abundances Y
    function flux(k, Y) {
      const r = RX[k];
      let F = fe[k] * r.sin, R = re[k] * r.sout;
      for (const x of r.in) F *= Y[x];
      for (const x of r.out) R *= Y[x];
      return F - R;
    }
    function rhs(u, Y, out) {
      eval_(u);
      out.fill(0);
      for (let k = 0; k < NR; k++) {
        const fl = flux(k, Y) * dtduNow, nu = RX[k].nu;
        for (let s = 0; s < NS; s++) if (nu[s]) out[s] += nu[s] * fl;
      }
    }
    function jac(Y, J) {          // uses the rates of the last eval_
      J.fill(0);
      for (let k = 0; k < NR; k++) {
        const r = RX[k], nu = r.nu;
        const part = (list, c, sign) => {
          for (let m = 0; m < list.length; m++) {
            let v = c;
            for (let j = 0; j < list.length; j++) if (j !== m) v *= Y[list[j]];
            const col = list[m];
            for (let s = 0; s < NS; s++) if (nu[s]) J[s * NS + col] += sign * nu[s] * v * dtduNow;
          }
        };
        part(r.in, fe[k] * r.sin, 1);
        if (re[k]) part(r.out, re[k] * r.sout, -1);
      }
    }
    return { eta, tau, dtdu, time, H, eval_, flux, rhs, jac, fe, re };
  }

  // LU decomposition with partial pivoting (in place) and solve
  function lu(A, piv) {
    for (let k = 0; k < NS; k++) {
      let m = k, big = Math.abs(A[k * NS + k]);
      for (let i = k + 1; i < NS; i++) if (Math.abs(A[i * NS + k]) > big) { big = Math.abs(A[i * NS + k]); m = i; }
      piv[k] = m;
      if (m !== k) for (let j = 0; j < NS; j++) { const tmp = A[k * NS + j]; A[k * NS + j] = A[m * NS + j]; A[m * NS + j] = tmp; }
      const akk = A[k * NS + k];
      for (let i = k + 1; i < NS; i++) {
        const f = (A[i * NS + k] /= akk);
        if (f) for (let j = k + 1; j < NS; j++) A[i * NS + j] -= f * A[k * NS + j];
      }
    }
  }
  function solve(A, piv, b) {
    for (let k = 0; k < NS; k++) { const m = piv[k]; if (m !== k) { const tmp = b[k]; b[k] = b[m]; b[m] = tmp; } }
    for (let i = 1; i < NS; i++) { let s = b[i]; for (let j = 0; j < i; j++) s -= A[i * NS + j] * b[j]; b[i] = s; }
    for (let i = NS - 1; i >= 0; i--) { let s = b[i]; for (let j = i + 1; j < NS; j++) s -= A[i * NS + j] * b[j]; b[i] = s / A[i * NS + i]; }
  }

  const GAM = 1 + 1 / Math.SQRT2;
  function run(par, opt = {}) {
    const M = makeModel(par);
    const rtol = opt.rtol ?? 1e-3, atol = opt.atol ?? 1e-10, hmax = opt.hmax ?? 0.05;
    const Y = new Float64Array(NS).fill(0);
    const Q0 = QNP / G.T[0];
    Y[n] = 1 / (1 + EX(Q0)); Y[p] = 1 - Y[n];
    const f0 = new Float64Array(NS), f1 = new Float64Array(NS), fu = new Float64Array(NS), k1 = new Float64Array(NS),
      k2 = new Float64Array(NS), Yt = new Float64Array(NS), Yn = new Float64Array(NS), J = new Float64Array(NS * NS),
      A = new Float64Array(NS * NS), piv = new Int32Array(NS);
    const us = [0], Ys = [Float64Array.from(Y)];
    let u = 0, h = 1e-3, steps = 0, rejects = 0;
    const DEL = 1e-5;
    while (u < U1 - 1e-12) {
      h = Math.min(h, hmax, U1 - u);
      M.rhs(u + DEL, Y, fu);
      M.rhs(u, Y, f0);
      for (let s = 0; s < NS; s++) fu[s] = (fu[s] - f0[s]) / DEL;
      M.jac(Y, J);
      for (;;) {
        for (let i = 0; i < NS * NS; i++) A[i] = -GAM * h * J[i];
        for (let s = 0; s < NS; s++) A[s * NS + s] += 1;
        lu(A, piv);
        for (let s = 0; s < NS; s++) k1[s] = f0[s] + GAM * h * fu[s];
        solve(A, piv, k1);
        for (let s = 0; s < NS; s++) Yt[s] = Y[s] + h * k1[s];
        M.rhs(u + h, Yt, f1);
        for (let s = 0; s < NS; s++) k2[s] = f1[s] - 2 * k1[s] - GAM * h * fu[s];
        solve(A, piv, k2);
        let err = 0;
        for (let s = 0; s < NS; s++) {
          Yn[s] = Y[s] + 1.5 * h * k1[s] + 0.5 * h * k2[s];
          const e = Math.abs(0.5 * h * (k1[s] + k2[s])) / (atol + rtol * Math.max(Math.abs(Y[s]), Math.abs(Yn[s])));
          if (e > err) err = e;
        }
        const fac = Math.min(3, Math.max(0.2, 0.9 / Math.sqrt(err + 1e-10)));
        if (err <= 1 || h < 1e-7) {
          u += h; steps++;
          for (let s = 0; s < NS; s++) Y[s] = Math.max(Yn[s], 0);
          us.push(u); Ys.push(Float64Array.from(Y));
          h *= fac;
          break;
        }
        rejects++;
        h *= fac;
      }
    }
    const Yf = Y;
    const fin = {
      Yp: 4 * Yf[a4], DH: Yf[d] / Yf[p], He3H: (Yf[h3] + Yf[t]) / Yf[p], Li7H: (Yf[li] + Yf[be]) / Yf[p],
    };
    return { par, model: M, u: Float64Array.from(us), Y: Ys, final: fin, steps, rejects };
  }

  // background quantities at u (for plotting)
  function at(u, arr) {
    const x = Math.min(Math.max(u / DU, 0), NU - 1.000001), i = Math.floor(x), w = x - i;
    return arr[i] + w * (arr[i + 1] - arr[i]);
  }

  // abundances at u from a run (linear in u, logarithmic in Y)
  function abundances(R, u) {
    const us = R.u;
    let lo = 0, hi = us.length - 1;
    if (u <= us[0]) return R.Y[0];
    if (u >= us[hi]) return R.Y[hi];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (us[m] <= u) lo = m; else hi = m; }
    const w = (u - us[lo]) / (us[hi] - us[lo]), a = R.Y[lo], b = R.Y[hi], out = new Float64Array(NS);
    for (let s = 0; s < NS; s++)
      out[s] = a[s] > 0 && b[s] > 0 ? Math.exp(Math.log(a[s]) + w * Math.log(b[s] / a[s])) : a[s] + w * (b[s] - a[s]);
    return out;
  }
  // photons per baryon at u, in total and above the energy E [MeV]
  function photonsPerBaryon(u, eta10, E) {
    const T = at(u, G.T), ng = 2 * ZETA3 / Math.PI ** 2 * (T / HBARC) ** 3, nb = eta10 * 1e-10 * at(u, G.rhob1) / MU;
    const x = E / T;
    let tail = 0;
    for (let k = 1; k <= 30; k++) tail += Math.exp(-k * x) * (x * x / k + 2 * x / k ** 2 + 2 / k ** 3);
    return [ng / nb, ng / nb * tail / (2 * ZETA3)];
  }
  // equilibrium abundances for given n and p abundances at u: D from n + p <-> D + gamma,
  // 4He through D(p,gamma)3He(n,gamma)4He (nuclear statistical equilibrium)
  function nse(u, eta10, Yn, Yp) {
    const rho = eta10 * 1e-10 * at(u, G.rhob1);
    const K = k => rho * Math.exp(-at(u, G.lrr[k]));
    const kn = RX.findIndex(r => r.k === "npg"), kd = RX.findIndex(r => r.k === "dpg"), kh = RX.findIndex(r => r.k === "h3ng");
    const D = K(kn) * Yn * Yp;
    return { D, He4: K(kh) * Yn * K(kd) * Yp * D };
  }

  window.BbnNet = { NUC, RX, G, NU, DU, U1, T9START, T9END, MEV_PER_T9, QNP, ME, run, at, makeModel, abundances, photonsPerBaryon, nse };
})();

<script>
// App N: Big Bang nucleosynthesis.
// The reaction network of bbn_net.js is integrated live (a few ms per run) for the baryon-to-photon
// ratio, N_eff and the neutron lifetime on the sliders. Left: mass fractions against temperature
// (with their equilibrium values) and, below, the two clocks that set the outcome: weak
// interactions per Hubble time and photons energetic enough to break up deuterium, per baryon.
// A cursor (drag or play) selects a moment; the nuclide chart on the right shows the net flow

(() => {
  const { COL, fmt } = window.Cosmo;

    { k: "tau", label: "τ<sub>n</sub>", min: 800, max: 1000, step: 0.1,

  ];
  const HINT0 = "Drag the cursor across the left plots (or press ▶) to follow the first hours; the nuclide chart shows the net flow between nuclei at that moment. " +
    "Hover over a slider for what it does; click into the lower right plot to choose η.";

  const sup = n => String(n).replace("-", "⁻").replace(/\d/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]);

    if (!(v > 0)) return "0";

        L.path.select("title").text(tip.join("\n"));
      });
    }

    // --- controls --------------------------------------------------------------------------------------
    const hint = $(".bbn-hint");
    hint.innerHTML = HINT0;
    const sliders = [...root.querySelectorAll(".bbn-slider")];
    function syncSliders() {
      sliders.forEach((el, i) => {
        const p = PAR[i], v = state[p.k];
        el.querySelector("input").value = p.log ? Math.log(v) : v;
        el.querySelector(".val").innerHTML = p.show(v);
      });
    }
    sliders.forEach((el, i) => {
      const p = PAR[i], inp = el.querySelector("input");
      inp.oninput = () => { state[p.k] = p.log ? Math.exp(+inp.value) : +inp.value; syncSliders(); schedule(); };
      el.onmouseenter = () => { hint.innerHTML = p.hint; };
      inp.onfocus = () => { hint.innerHTML = p.hint; };
      el.onmouseleave = () => { hint.innerHTML = HINT0; };
    });
    $(".reset").onclick = () => { Object.assign(state, DEF); syncSliders(); schedule(); };
    $(".eqck input").onchange = e => { state.eq = e.target.checked; eqG.attr("display", state.eq ? null : "none"); };

    // play: sweep the cursor from 2.6 MeV to 1 keV in about 15 s, evenly in log T; starts from the
    // beginning unless it was paused with the button
    let playing = false, paused = false, last = 0;
    const playBtn = $(".play");
    function stop(byButton) { playing = false; paused = !!byButton; playBtn.textContent = paused ? "▶ resume" : "▶ play"; }
    playBtn.onclick = () => {
      if (playing) { stop(true); return; }
      if (!paused || state.u >= N.U1 - 1e-6) state.u = 0;
      playing = true; playBtn.textContent = "❚❚ pause"; last = performance.now();
      const tick = now => {
        if (!playing) return;
        state.u = Math.min(N.U1, state.u + (now - last) / 15000 * N.U1);
        last = now;
        cursor();
        if (state.u >= N.U1) stop(); else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };

    let pending = false;
    function schedule() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        R = N.run(state); M = R.model;
        drawRun(); drawSchramm(); cursor();
        schrammGrid();
      });
    }
    syncSliders();
    schedule();
  }

  window.CosmoApps = Object.assign(window.CosmoApps || {}, { bbn: mount });
})();

</script>
<script>
CosmoApps.bbn(document.getElementById("app-bbn"));
// scale the fixed-size app (laid out for 1600 px wide slides) to fit the window, like a slide;
// if that would make it too small, fit only the width and let the page scroll
(() => {
  const st = document.getElementById("stage"), wrap = document.getElementById("wrap");
  const note = document.getElementById("note");
  // phones and portrait tablets; uses the device screen, so a narrow Moodle iframe on a laptop shows no note
  const small = () => Math.min(screen.width, screen.height) < 600 || screen.height > screen.width;
  let closed = false;
  note.querySelector("button").onclick = () => { closed = true; fit(); };
  const fit = () => {
    note.classList.toggle("show", !closed && small());
    const W = document.documentElement.clientWidth, H = innerHeight - note.offsetHeight;
    const kw = Math.min(1, W / st.offsetWidth), kh = H / st.offsetHeight;
    const k = Math.min(kw, Math.max(kh, 0.6 * kw));
    st.style.transform = `translateX(${Math.max(0, (W - st.offsetWidth * k) / 2)}px) scale(${k})`;
    wrap.style.height = st.offsetHeight * k + "px";
  };
  addEventListener("resize", fit);
  new ResizeObserver(fit).observe(st);      // the info text below the plot changes height
  fit();
})();
</script>
